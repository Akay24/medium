# Run spec for the redis-basic code example.
# The article code fence references this via: ```ts run=redis-basic
id: redis-basic
# Base image pinned to an explicit version.
image: node:22-bookworm-slim
setup:
  - npm init -y >/dev/null 2>&1
  - npm install redis@4 >/dev/null 2>&1
# Fixed execution command; article snippet bytes are mounted read-only.
run: node run-tests.mjs
timeoutMs: 60000
memoryMb: 512
cpus: 1
pidsLimit: 128
maxOutputBytes: 1000000
networkEnabled: false
services:
  - name: redis
    image: redis:7.2
    ports: []
# What the assertions in the harness actually test.
asserts: >
  The harness asserts basic SET/GET and TTL behavior of the article's Redis
  client snippet against a real redis server. It validates the snippet, it is
  not part of it.
# Behaviors deliberately NOT covered by the assertions.
untested:
  - connection pooling under concurrency
  - cluster mode
  - actual cache hit-rate improvement (requires a benchmark, not asserted here)
cleanup: always
