<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="client-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="app-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="redis-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="db-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="hit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#22d3ee" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" rx="16" fill="url(#bg-grad)" stroke="#1f2937" stroke-width="2" />

  <!-- Header Banner -->
  <rect x="30" y="24" width="900" height="48" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="54" cy="48" r="6" fill="#f43f5e" />
  <circle cx="72" cy="48" r="6" fill="#f59e0b" />
  <circle cx="90" cy="48" r="6" fill="#10b981" />
  <text x="114" y="53" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1">CACHE-ASIDE REQUEST PATH LIFECYCLE (HIT VS. MISS)</text>
  <rect x="760" y="34" width="154" height="28" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="774" y="52" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">SUB-MS IN-MEMORY</text>

  <!-- Lifeline Columns -->
  <!-- Client -->
  <rect x="80" y="90" width="150" height="44" rx="8" fill="url(#client-grad)" filter="url(#shadow)" />
  <text x="155" y="117" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Client / Browser</text>
  <line x1="155" y1="134" x2="155" y2="500" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" />

  <!-- App Server -->
  <rect x="300" y="90" width="160" height="44" rx="8" fill="url(#app-grad)" filter="url(#shadow)" />
  <text x="380" y="117" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Application Server</text>
  <line x1="380" y1="134" x2="380" y2="500" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Redis -->
  <rect x="530" y="90" width="170" height="44" rx="8" fill="url(#redis-grad)" filter="url(#shadow)" />
  <text x="615" y="117" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Redis In-Memory</text>
  <line x1="615" y1="134" x2="615" y2="500" stroke="#475569" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Database -->
  <rect x="760" y="90" width="140" height="44" rx="8" fill="url(#db-grad)" filter="url(#shadow)" />
  <text x="830" y="117" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Database (SQL)</text>
  <line x1="830" y1="134" x2="830" y2="500" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" />

  <!-- SECTION 1: CACHE HIT PATH -->
  <rect x="50" y="150" width="860" height="150" rx="10" fill="#064e3b" fill-opacity="0.25" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 4" />
  <rect x="65" y="158" width="160" height="22" rx="4" fill="url(#hit-grad)" />
  <text x="145" y="173" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">PATH A: CACHE HIT (0.39 ms)</text>

  <!-- Step 1: Request -->
  <line x1="155" y1="195" x2="374" y2="195" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <text x="260" y="188" text-anchor="middle" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">1. GET /api/users/1001</text>

  <!-- Step 2: Cache GET -->
  <line x1="380" y1="215" x2="609" y2="215" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrow-rose)" />
  <text x="495" y="208" text-anchor="middle" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">2. GET cache:users:1001</text>

  <!-- Step 3: Hit Return -->
  <line x1="615" y1="240" x2="386" y2="240" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <text x="495" y="233" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">3. Return User JSON</text>

  <!-- Step 4: Fast Response -->
  <line x1="380" y1="265" x2="161" y2="265" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <text x="260" y="258" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">4. 200 OK (0.39ms total)</text>

  <!-- Cache Hit Badge -->
  <rect x="740" y="195" width="140" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
  <text x="810" y="218" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">ZERO DB I/O</text>
  <text x="810" y="238" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Sub-millisecond RAM</text>

  <!-- SECTION 2: CACHE MISS PATH -->
  <rect x="50" y="315" width="860" height="195" rx="10" fill="#4c0519" fill-opacity="0.2" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4 4" />
  <rect x="65" y="323" width="170" height="22" rx="4" fill="#e11d48" />
  <text x="150" y="338" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">PATH B: CACHE MISS (60.5 ms)</text>

  <!-- Miss Step 1: Cache Miss Query -->
  <line x1="380" y1="358" x2="609" y2="358" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-rose)" />
  <text x="495" y="352" text-anchor="middle" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">1. GET key -> nil (Cache Miss)</text>

  <!-- Miss Step 2: Query DB -->
  <line x1="380" y1="388" x2="824" y2="388" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrow-cyan)" />
  <text x="600" y="381" text-anchor="middle" fill="#67e8f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">2. SELECT * FROM users WHERE id=1001 (~50ms)</text>

  <!-- Miss Step 3: DB Return -->
  <line x1="830" y1="418" x2="386" y2="418" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)" />
  <text x="600" y="411" text-anchor="middle" fill="#67e8f9" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">3. Return Row Record</text>

  <!-- Miss Step 4: Write to Cache with TTL -->
  <line x1="380" y1="448" x2="609" y2="448" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="495" y="441" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">4. SET key JSON EX 60 (Populate Cache)</text>

  <!-- Miss Step 5: Return to Client -->
  <line x1="380" y1="478" x2="161" y2="478" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="260" y="471" text-anchor="middle" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">5. 200 OK (60.5ms total)</text>
</svg>
