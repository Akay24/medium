<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="evict-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="16" fill="url(#bg-grad-3)" stroke="#1f2937" stroke-width="2" />

  <!-- Header Banner -->
  <rect x="30" y="24" width="900" height="48" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="54" cy="48" r="6" fill="#ef4444" />
  <circle cx="72" cy="48" r="6" fill="#f59e0b" />
  <circle cx="90" cy="48" r="6" fill="#10b981" />
  <text x="114" y="53" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1">REDIS MEMORY EXHAUSTION &amp; SAMPLED EVICTION ENGINE</text>
  <rect x="730" y="34" width="184" height="28" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="746" y="52" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">ZERO POINTER OVERHEAD</text>

  <!-- Left Column: Memory Threshold & Policies -->
  <rect x="40" y="95" width="410" height="410" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#evict-shadow)" />
  <rect x="55" y="108" width="380" height="28" rx="6" fill="url(#header-grad)" />
  <text x="245" y="126" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">1. MEMORY THRESHOLD (used_memory &gt; maxmemory)</text>

  <!-- Policy Badges -->
  <rect x="55" y="150" width="180" height="48" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <text x="145" y="170" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">allkeys-lru</text>
  <text x="145" y="186" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="9">Recommended for pure cache</text>

  <rect x="255" y="150" width="180" height="48" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1" />
  <text x="345" y="170" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700">volatile-lru</text>
  <text x="345" y="186" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9">Only evicts keys with TTL</text>

  <rect x="55" y="210" width="180" height="48" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1" />
  <text x="145" y="230" text-anchor="middle" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="700">allkeys-lfu</text>
  <text x="145" y="246" text-anchor="middle" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="9">Frequency based (counts)</text>

  <rect x="255" y="210" width="180" height="48" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1" />
  <text x="345" y="230" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700">volatile-lfu</text>
  <text x="345" y="246" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9">LFU on TTL keys only</text>

  <rect x="55" y="270" width="180" height="48" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="1.5" />
  <text x="145" y="290" text-anchor="middle" fill="#fb7185" font-family="monospace" font-size="11" font-weight="700">noeviction (Default)</text>
  <text x="145" y="306" text-anchor="middle" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="9">OOM error on writes!</text>

  <rect x="255" y="270" width="180" height="48" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1" />
  <text x="345" y="290" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700">volatile-ttl</text>
  <text x="345" y="306" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9">Shortest remaining life</text>

  <!-- Architectural Callout Box -->
  <rect x="55" y="335" width="380" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="70" y="360" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">THE DANGER OF 'volatile-lru':</text>
  <text x="70" y="385" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">If you configure <tspan fill="#fca5a5" font-family="monospace">volatile-lru</tspan> but insert keys</text>
  <text x="70" y="405" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">without a TTL, Redis has <tspan fill="#f87171" font-weight="700">0 candidate keys</tspan> to evict.</text>
  <text x="70" y="430" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Redis then falls back to behaving like <tspan fill="#f87171" font-family="monospace">noeviction</tspan>,</text>
  <text x="70" y="450" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">throwing <tspan fill="#f87171" font-weight="700">OOM Errors</tspan> across all backend writes.</text>

  <!-- Right Column: How Sampled Eviction Works -->
  <rect x="480" y="95" width="440" height="410" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#evict-shadow)" />
  <rect x="495" y="108" width="410" height="28" rx="6" fill="#3b82f6" />
  <text x="700" y="126" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">2. REDIS SAMPLED POOL (maxmemory-samples = 5)</text>

  <!-- 5 Sampled Keys Cards -->
  <rect x="500" y="155" width="400" height="42" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="520" y="180" fill="#94a3b8" font-family="monospace" font-size="11">Sample 1: key:session_881</text>
  <rect x="760" y="163" width="125" height="24" rx="4" fill="#334155" />
  <text x="822" y="179" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10">Idle: 12 seconds</text>

  <rect x="500" y="205" width="400" height="42" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="520" y="230" fill="#94a3b8" font-family="monospace" font-size="11">Sample 2: key:item_9012</text>
  <rect x="760" y="213" width="125" height="24" rx="4" fill="#334155" />
  <text x="822" y="229" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10">Idle: 85 seconds</text>

  <rect x="500" y="255" width="400" height="42" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="520" y="280" fill="#94a3b8" font-family="monospace" font-size="11">Sample 3: key:feed_3411</text>
  <rect x="760" y="263" width="125" height="24" rx="4" fill="#334155" />
  <text x="822" y="279" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10">Idle: 4 seconds</text>

  <!-- Eviction Winner Card (Oldest Idle) -->
  <rect x="500" y="305" width="400" height="48" rx="8" fill="#4c0519" stroke="#ef4444" stroke-width="2" />
  <text x="520" y="334" fill="#fca5a5" font-family="monospace" font-size="11" font-weight="700">Sample 4: key:order_1029</text>
  <rect x="740" y="315" width="145" height="28" rx="4" fill="#b91c1c" />
  <text x="812" y="333" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">Idle: 1,420s (EVICT!)</text>

  <rect x="500" y="362" width="400" height="42" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="520" y="387" fill="#94a3b8" font-family="monospace" font-size="11">Sample 5: key:user_profile</text>
  <rect x="760" y="370" width="125" height="24" rx="4" fill="#334155" />
  <text x="822" y="386" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10">Idle: 19 seconds</text>

  <!-- Explanation Bottom Box -->
  <rect x="500" y="420" width="400" height="68" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <text x="700" y="445" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">NO DOUBLY-LINKED LIST REQUIRED</text>
  <text x="700" y="468" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="10">Saves 16 bytes per key. Samples 5 keys and yields 99% true-LRU precision.</text>
</svg>
