<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="worker-a-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="worker-b-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="race-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="16" fill="url(#bg-grad-4)" stroke="#1f2937" stroke-width="2" />

  <!-- Header Banner -->
  <rect x="30" y="24" width="900" height="48" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="54" cy="48" r="6" fill="#ef4444" />
  <circle cx="72" cy="48" r="6" fill="#f59e0b" />
  <circle cx="90" cy="48" r="6" fill="#10b981" />
  <text x="114" y="53" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1">THE DUAL-WRITE DILEMMA: WHY 'DEL' BEATS 'SET' ON DATABASE WRITES</text>
  <rect x="730" y="34" width="184" height="28" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="746" y="52" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">PREVENT STALE DATA</text>

  <!-- Left: The Flawed "SET Update" Approach -->
  <rect x="40" y="95" width="425" height="410" rx="12" fill="#4c0519" fill-opacity="0.25" stroke="#e11d48" stroke-width="1.5" filter="url(#race-shadow)" />
  <rect x="55" y="108" width="395" height="28" rx="6" fill="#e11d48" />
  <text x="252" y="126" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">FLAWED: UPDATING CACHE DIRECTLY (SET)</text>

  <!-- Timeline Sequence -->
  <rect x="60" y="150" width="170" height="40" rx="6" fill="url(#worker-a-grad)" />
  <text x="145" y="174" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Worker A (Tier = VIP)</text>

  <rect x="255" y="150" width="170" height="40" rx="6" fill="url(#worker-b-grad)" />
  <text x="340" y="174" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Worker B (Tier = Basic)</text>

  <!-- Step 1 & 2 in DB -->
  <rect x="60" y="205" width="385" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="75" y="226" fill="#f472b6" font-family="monospace" font-size="10">1. Worker A: UPDATE user SET tier='VIP'</text>
  <text x="75" y="244" fill="#60a5fa" font-family="monospace" font-size="10">2. Worker B: UPDATE user SET tier='Basic' (DB is now 'Basic')</text>

  <!-- Step 3 & 4 in Cache Out of Order -->
  <rect x="60" y="270" width="385" height="70" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
  <text x="75" y="292" fill="#60a5fa" font-family="monospace" font-size="10">3. Worker B writes first: SET cache:user 'Basic'</text>
  <text x="75" y="312" fill="#f472b6" font-family="monospace" font-size="10">4. Worker A delayed packet arrives late:</text>
  <text x="95" y="330" fill="#f87171" font-family="monospace" font-size="10" font-weight="700">   SET cache:user 'VIP' (Overwrites B!)</text>

  <!-- Discrepancy Failure Box -->
  <rect x="60" y="355" width="385" height="135" rx="8" fill="#7f1d1d" fill-opacity="0.5" stroke="#ef4444" stroke-width="2" />
  <text x="252" y="380" text-anchor="middle" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">PERMANENT STALE CORRUPTION</text>
  <line x1="80" y1="392" x2="425" y2="392" stroke="#ef4444" stroke-width="1" />
  <text x="80" y="415" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11">Database Truth: <tspan fill="#34d399" font-weight="700">tier = 'Basic'</tspan></text>
  <text x="80" y="438" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11">Redis Cache:    <tspan fill="#f87171" font-weight="700">tier = 'VIP' (STALE!)</tspan></text>
  <text x="80" y="468" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="10">Users see VIP tier indefinitely until cache TTL expires!</text>

  <!-- Right: The Correct "DEL Invalidation" Approach -->
  <rect x="495" y="95" width="425" height="410" rx="12" fill="#064e3b" fill-opacity="0.25" stroke="#10b981" stroke-width="1.5" filter="url(#race-shadow)" />
  <rect x="510" y="108" width="395" height="28" rx="6" fill="#10b981" />
  <text x="707" y="126" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">CORRECT: CACHE INVALIDATION (DEL)</text>

  <!-- Steps in DEL approach -->
  <rect x="515" y="155" width="385" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="530" y="177" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. Worker executes SQL UPDATE</text>
  <text x="530" y="197" fill="#94a3b8" font-family="monospace" font-size="10">UPDATE users SET tier = 'Basic' WHERE id = 1001</text>

  <rect x="515" y="225" width="385" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="530" y="247" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. Invalidate Cache Key Immediately</text>
  <text x="530" y="267" fill="#a7f3d0" font-family="monospace" font-size="10">redis.delete("cache:users:1001")</text>

  <rect x="515" y="295" width="385" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="530" y="317" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3. Subsequent Read Triggers Clean Cache Miss</text>
  <text x="530" y="337" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10">Next client fetches fresh state from database.</text>

  <!-- Success Guarantee Box -->
  <rect x="515" y="365" width="385" height="125" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2" />
  <text x="707" y="392" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">GUARANTEED EVENTUAL CONSISTENCY</text>
  <line x1="535" y1="404" x2="880" y2="404" stroke="#10b981" stroke-width="1" />
  <text x="535" y="428" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11">&#10003; Zero race condition between competing writers</text>
  <text x="535" y="450" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11">&#10003; Lazy reload ensures only active keys consume RAM</text>
  <text x="535" y="472" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="10">Standard recommendation across High-Scalability architectures.</text>
</svg>
